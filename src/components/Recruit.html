<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form {
            width: 260px;
            height: 260px;
            position: relative;
        }
        .box {
            width: 200px;
            height: 200px;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -100px;
            margin-left: -100px;
        }
    </style>
</head>
<body>
    <form action="">
        <div class="box">123</div>
         <table>
            <tr><td><label for="">회사 공고 등록 후 AI 코칭 받기</label></td></tr>
            <tr>
                <th><label for="">회사이름</label></th>
                <td>
                    <input type="text" list="list">
                    <datalist id="list">
                        <option value="회사1"></option>
                        <option value="회사2"></option>
                        <option value="회사3"></option>
                    </datalist>
                </td>
            </tr>
            <tr>
                <th><label for="">지원 직무</label></th>
                <td>
                    <select name="" id="">
                        <option>프론트엔드</option>
                        <option>백엔드</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th><label for="">경력</label></th>
                <td>
                    <select name="" id="">
                        <option>신입</option>
                        <option>경력</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th><label for="">지원날짜</label></th>
                <td><input type="date"></td>
            </tr>
        </table>
    </form>
</body>
</html>
